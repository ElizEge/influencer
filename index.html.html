<!DOCTYPE html>
<html lang="tr">
<!-- V46.4: Stüdyoda AI açı ölçer kaldırıldı, master prompt sağ sütunda; yönetmen komutları kaldırıldı; storyboard görselleri aynı sahnede üzerine yazılır, şerit yalnız etkin sahne; tek "Promptu yaz" düğmesi; proje akışı tek satır; Image Lab dikey önizleme; uzun sahnede "sahnelere böl" önerisi. -->
<!-- V46.0: Kamera/stil/oran bölümü yerine metin içi yönetmen komutları (/oran, /lens, /açı, /stil, /ışık, /aydınlatma, /hava, /mevsim, /seed). Monitör karenin oranına göre konumlanır (elle ayar dikey/yatay ayrı). Sütunlar yalnız kullanıcı isteyince daralır. Video: Google Flow + "Diğer platformlar" tek alanda; standart süre üst modelin sınırı; iki indirme (Tüm paket, Tam prompt) + Projeyi kaydet. Süreklilik kitabı: mekân, ışık, kıyafet, objeler, yerleşim, eksen ve üslup tüm üretim ve denetim motorlarına aynı metinle gider. -->
<!-- V45.6: Pafta gerçek panel sınırlarından bölünür (eşit bölme yedek); stil kilidi (çizim/anime yok) ve panel içi kolaj/ek kare yasağı; kareler boşluksuz dikdörtgen ızgarada dizilir. -->
<!-- V45.5: Sıfırdan modda 01 sıradan ilk kare (aynı oran ve satır, büyük açılış alanı yok; pafta görseli de eşit ızgara). Tekrar eden kareleri önleyen çeşitlilik kuralı, görünür sonuç kuralı, ters köşe objesinin gelişmede gelmesi; denetimde "tekrar eden kare" türü. Video promptunda insan dışı kadro için güvenli dil ve kurulum/sonuç repliği. -->
<!-- V45.4: Hikâye omurgası (giriş → gelişme → sonuç) ve obje listesi; açılış sıfırdan kurulur (referans yalnızca görünüm); ilk ve son kare tek görselde eşleşik çift olarak üretilir, ara kareler bu iki karenin arasına kurulur; akış denetimi ilk–son kare okunurluğunu ve listede olmayan objeleri de denetler. Tüm kadrolarda geçerli. -->
<!-- V45.3: Satır içi ses etiketleri (KAYRA (laughing, bright high-pitched voice, fast): "..."), Karadeniz kadrosuna koyu Trabzon ağızlı ses kartları, akıllı kıyafet kelimeleri (bikini → beach top with matching beach bottoms; shirtless/sunbathe), ilk kare uyarısı, meslek objesi kuralı. -->
<!-- V45.2: Flow politika güvenliği (yetişkin kadro, mayo/bar/alkol yerine güvenli eşdeğerler, riskli kelime uyarısı). Kamera dili kuralları (180°, 30°, kurgu sırası). Bütün akış denetimi: tüm kareler + önceki sahnenin son karesi birlikte denetlenir, sorunlu kareler sırayla yeniden üretilir. -->
<!-- V45.1: Kısa ses kilidi (prompta 20–30 kelime/karakter; ayrıntılı kart yalnız yazara). Saniye bazlı yoğunluk bütçesi (10 sn → en fazla 3 kadraj, 3 replik, 20 kelime). Standart sahne süresi 10 sn. -->
<!-- V45.0: Karakter ses kartları (Lena, Kayra, Metin; Metin için seçilebilir ses tipi: standart / Trabzon ağzı / karışık). Ses kilidi Storyboard video promptlarının sonuna her parçada aynen eklenir. Önceden derlenmiş JS (Babel yok). -->
<!-- V44: Karakter Portalı (5 grup, 28 karakter), Lena/Kayra/Metin yeni kimlikleri (ElizEge/influencer), 25 karakter (ElizEge/characters), insan dışı karakterler için tasarım kimliği kilidi, eski kadro için tek seferlik geçiş. API/model/SYS katmanı V43 ile aynıdır. -->
<!-- Kalıcı tasarım kararı: Pafta oranları yalnızca 16:9, 9:16, 4:5. Storyboard sayıları 3/6/9/12; yeni çalışma 3 kareyle başlar. 2 kare başlangıç-bitiş video akışında ele alınır. -->
<!-- V37 Final kararları: V36 API/model/SYS katmanı korunmuştur. Beş ana sekme; Storyboard içinde video hazırlığı. Ortak Image Lab düzenleme ve onayla kaynak kareye dönüş. Yeniden üretimde kare kimliği korunur, son iki sürüm geri alınabilir. Yerel prompt aç/kapat. Birleşik Studio referans kaynağı. Influencer story bağlamı, kıyafet ve ortam kilidi. Bağımlı video promptları kaynak değişiminde uyarılır. Kontroller: JSX derleme, ilk bileşen render testi, yerinde değiştirme testleri, API/SYS eşitliği. Canlı API ve tarayıcı görsel kontrolü bu ortamda yapılmadı. -->
<!-- V39: Studio (AI açı ölçer dahil) + Image Lab + Storyboard. Influencer ayrı proje: AiFotofilm Influencer Studio. -->
<!-- V38: Storyboard tek akış (pafta içinde ilk/son kare + final video promptları), daralan seçiciler, sadeleştirilmiş Influencer ve Image Lab. API katmanı, modeller ve SYS metinleri V37.4 RC1 ile bayt bayt aynıdır. -->
